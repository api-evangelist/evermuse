aid: evermuse
name: Evermuse
description: >-
  Evermuse is an AI advisor for product teams that turns every customer signal —
  sales and success calls, support conversations, meeting notes, emails, surveys,
  and reviews — into code-ready, well-researched feature specifications. Its
  Ingestion API accepts records wrapped in a canonical Integration Envelope (JSON
  or NDJSON), validates, normalizes, deduplicates, and stores them in the Evermuse
  Data Lake for AI analysis into user needs, feature requests, and prioritized
  opportunities. Evermuse also publishes a hosted, OAuth 2.1-protected Model Context
  Protocol (MCP) server that plugs Claude, ChatGPT, Cursor, and other agents directly
  into a workspace's real customer evidence and live roadmap.
